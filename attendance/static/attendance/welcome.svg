" cy="189" rx="17" ry="9" fill="#eaa470" opacity=".5" /><ellipse cx="342" cy="189" rx="17" ry="9" fill="#eaa470" opacity=".5" /><g class="surprise-mouth"><ellipse cx="279" cy="211" rx="19" ry="25" fill="#a46d48" /><ellipse cx="279" cy="221" rx="11" ry="9" fill="#d99275" /></g></g></g></g><g fill="#b29acc" class="sparkles"><path d="M107 105l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" /><path d="M456 131l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" /><circle cx="425" cy="83" r="5" /><circle cx="97" cy="325" r="4" /><circle cx="469" cy="337" r="5" /></g><path d="M278 338l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#cbb4e5" /><path d="M157 88q-12-24-24-9t24 29q36-25 23-35t-23 15" fill="#d9c7ed" transform="translate(264 81) scale(.5)" /></svg>