<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eee6fc" /><stop offset="1" stop-color="#f7f1fd" /></linearGradient><linearGradient id="yellow" x2=".8" y2="1"><stop stop-color="#ffdf91" /><stop offset="1" stop-color="#efb669" /></linearGradient><linearGradient id="pink" x2=".5" y2="1"><stop stop-color="#fac6d7" /><stop offset="1" stop-color="#eaa5c2" /></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#ccb8f3" /><stop offset="1" stop-color="#a18ad5" /></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#8b6baf" flood-opacity=".16" /></filter></defs><style>
.happy-body{animation:happy-bounce 4.6s ease-in-out infinite}
.happy-mouth{transform-box:fill-box;transform-origin:center top;animation:happy-smile 4.6s ease-in-out infinite}
.happy-eyes{animation:happy-eyes 4.6s ease-in-out infinite}
.happy-open-eyes{animation:happy-open-eyes 4.6s ease-in-out infinite}
.happy-cheek{animation:happy-blush 4.6s ease-in-out infinite}
.calm-body{animation:calm-sway 6s ease-in-out infinite}
.calm-eyes{transform-box:fill-box;transform-origin:center;animation:calm-blink 5.2s ease-in-out infinite}
.calm-mouth{transform-box:fill-box;transform-origin:center;animation:calm-smile 6s ease-in-out infinite}
.surprised-body{animation:surprise-bounce 5.5s ease-in-out infinite}
.surprise-mouth{transform-box:fill-box;transform-origin:center;animation:surprise-mouth 5.5s ease-in-out infinite}
.surprise-eye{transform-box:fill-box;transform-origin:center;animation:surprise-eye 5.5s ease-in-out infinite}
.sparkles{transform-box:fill-box;transform-origin:center;animation:sparkle 4.6s ease-in-out infinite}
@keyframes happy-bounce{0%,18%,75%,100%{transform:translateY(0)}30%,50%{transform:translateY(-10px)}40%,60%{transform:translateY(-4px)}}
@keyframes happy-smile{0%,15%,85%,100%{transform:scale(.7,.14)}28%,72%{transform:scale(1,1)}}
@keyframes happy-eyes{0%,15%,85%,100%{opacity:0}25%,75%{opacity:1}}
@keyframes happy-open-eyes{0%,15%,85%,100%{opacity:1}25%,75%{opacity:0}}
@keyframes happy-blush{0%,15%,85%,100%{opacity:.25}30%,70%{opacity:.75}}
@keyframes calm-sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes calm-blink{0%,36%,44%,80%,88%,100%{transform:scaleY(1)}39%,41%,83%,85%{transform:scaleY(.1)}}
@keyframes calm-smile{0%,15%,95%,100%{transform:scaleY(.2)}35%,75%{transform:scaleY(1.8)}}
@keyframes surprise-bounce{0%,20%,85%,100%{transform:translateY(0)}35%,65%{transform:translateY(-9px)}}
@keyframes surprise-mouth{0%,18%,90%,100%{transform:scale(.6,.2)}32%,70%{transform:scale(1,1)}}
@keyframes surprise-eye{0%,18%,90%,100%{transform:scaleY(.65)}32%,70%{transform:scaleY(1.12)}}
@keyframes sparkle{0%,100%{opacity:.5;transform:scale(.96)}45%{opacity:1;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.happy-open-eyes{opacity:0}}
